<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ФотоКалендарь — Личный график фотографа</title>

  <!-- PWA мета-теги для добавления на экран «Домой» (iOS и Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ФотоКалендарь" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F7F7F5" />

  <!-- Встроенные SVG-иконки приложения (без внешних URL) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F97316'/%3E%3Crect x='14' y='22' width='36' height='24' rx='6' fill='%23FFFFFF'/%3E%3Crect x='24' y='16' width='16' height='7' rx='2.5' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%2318181A'/%3E%3Ccircle cx='32' cy='34' r='3' fill='%23F97316'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23F97316'/%3E%3Crect x='38' y='60' width='104' height='70' rx='16' fill='%23FFFFFF'/%3E%3Crect x='66' y='44' width='48' height='20' rx='7' fill='%23FFFFFF'/%3E%3Ccircle cx='90' cy='95' r='20' fill='%2318181A'/%3E%3Ccircle cx='90' cy='95' r='8.5' fill='%23F97316'/%3E%3C/svg%3E" />

  <style>
    /* ========================================================================
       1. ДИЗАЙН-ТОКЕНЫ И БАЗОВЫЙ СБРОС (0 ВНЕШНИХ ЗАВИСИМОСТЕЙ)
       ======================================================================== */
    :root {
      --bg-outer: #EAEAE6;
      --bg-app: #F7F7F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F3F4F6;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;

      --text-primary: #18181A;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;

      /* Главный акцент — яркий оранжевый */
      --accent: #F97316;
      --accent-hover: #EA580C;
      --accent-soft: #FFF7ED;
      --accent-border: #FDBA74;

      /* Цвета статусов */
      --confirmed: #2563EB;
      --confirmed-bg: #EFF6FF;
      --confirmed-border: #BFDBFE;

      --editing: #D97706;
      --editing-bg: #FFFBEB;
      --editing-border: #FDE68A;

      --delivered: #10B981;
      --delivered-dark: #059669;
      --delivered-bg: #ECFDF5;
      --delivered-border: #A7F3D0;

      --dayoff: #6B7280;
      --dayoff-bg: #F3F4F6;
      --dayoff-border: #D1D5DB;

      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      --shadow-card: 0 1px 2px rgba(24, 24, 26, 0.04);
      --shadow-shell: 0 20px 60px -15px rgba(24, 24, 26, 0.14), 0 0 0 1px rgba(24, 24, 26, 0.06);
      --shadow-sheet: 0 -12px 40px -8px rgba(24, 24, 26, 0.22);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.4;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none !important;
    }

    /* ========================================================================
       2. ОБОЛОЧКА МОБИЛЬНОГО ПРИЛОЖЕНИЯ (MOBILE-FIRST, ДО 480px)
       ======================================================================== */
    .app-shell {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    @media (min-width: 520px) {
      body {
        background: var(--bg-outer);
        padding: 16px 0;
      }
      .app-shell {
        min-height: calc(100vh - 32px);
        min-height: calc(100dvh - 32px);
        border-radius: 28px;
        box-shadow: var(--shadow-shell);
      }
    }

    /* Верхняя шапка */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 247, 245, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .app-header {
        border-radius: 28px 28px 0 0;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.28);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      margin: 1px 0 0;
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-primary-sm {
      height: 38px;
      padding: 0 13px;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.24);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary-sm:hover,
    .btn-primary-sm:active {
      background: var(--accent-hover);
    }

    /* Основной контейнер контента */
    .app-main {
      flex: 1;
      padding: 14px 14px calc(92px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Фиксированная нижняя навигация (4 вкладки) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    @media (min-width: 520px) {
      .bottom-nav {
        position: sticky;
        left: auto;
        transform: none;
        border-radius: 0 0 28px 28px;
      }
    }

    .nav-btn {
      position: relative;
      min-height: 52px;
      border-radius: 14px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-secondary);
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .nav-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: var(--accent);
    }

    .nav-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
    }

    .nav-badge {
      position: absolute;
      top: -6px;
      right: -11px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #FFFFFF;
      line-height: 1;
    }

    /* ========================================================================
       3. ОБЩИЕ КАРТОЧКИ, КНОПКИ, БЕЙДЖИ И ПУСТЫЕ СОСТОЯНИЯ
       ======================================================================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-card);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .pill-confirmed {
      color: var(--confirmed);
      background: var(--confirmed-bg);
      border-color: var(--confirmed-border);
    }

    .pill-editing {
      color: var(--editing);
      background: var(--editing-bg);
      border-color: var(--editing-border);
    }

    .pill-delivered {
      color: var(--delivered-dark);
      background: var(--delivered-bg);
      border-color: var(--delivered-border);
    }

    .pill-dayoff {
      color: var(--dayoff);
      background: var(--dayoff-bg);
      border-color: var(--dayoff-border);
    }

    .pill-danger {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .pill-orange {
      color: var(--accent-hover);
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .pill-neutral {
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border-color: var(--border);
    }

    .btn-primary {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(249, 115, 22, 0.24);
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover,
    .btn-primary:active {
      background: var(--accent-hover);
    }

    .btn-secondary {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
    }

    .btn-danger-soft {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-danger-soft:hover {
      background: #FEE2E2;
    }

    .btn-outline-orange {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-hover);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline-orange:hover {
      background: #FFEDD5;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      transition: background-color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--bg-subtle);
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      gap: 2px;
    }

    .segmented-btn {
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .segmented-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 1px 3px rgba(249, 115, 22, 0.28);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px;
    }

    .section-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .section-sub {
      margin: 1px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .empty-state {
      background: var(--bg-card);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 28px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .empty-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .empty-desc {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 300px;
    }

    /* ========================================================================
       4. ВКЛАДКА 1: КАЛЕНДАРЬ (ТОЛЬКО «ПОДТВЕРЖДЕНО» И «ВЫХОДНОЙ»)
       ======================================================================== */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cal-month-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .cal-month-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      min-width: 134px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .btn-today {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
    }

    .btn-today:hover {
      background: #E5E7EB;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 6px;
      text-align: center;
    }

    .cal-wd {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 2px 0;
    }

    .cal-wd.weekend {
      color: var(--accent-hover);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-cell {
      position: relative;
      height: 44px;
      border-radius: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      border: 1.5px solid transparent;
      transition: background-color 0.12s ease, border-color 0.12s ease;
      user-select: none;
    }

    .cal-cell:hover {
      background: var(--bg-subtle);
    }

    .cal-cell.is-dayoff {
      background-color: #F3F4F6;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(107, 114, 128, 0.18),
        rgba(107, 114, 128, 0.18) 4px,
        transparent 4px,
        transparent 8px
      );
      border-color: var(--dayoff-border);
      color: var(--dayoff);
      font-weight: 600;
    }

    .cal-cell.is-today {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-weight: 700;
    }

    .cal-cell.is-selected {
      background: var(--accent) !important;
      background-image: none !important;
      border-color: var(--accent) !important;
      color: #FFFFFF !important;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.34);
    }

    .cal-day-num {
      line-height: 1;
    }

    .cal-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 6px;
    }

    .cal-dot {
      width: 5.5px;
      height: 5.5px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .dot-confirmed {
      background: var(--confirmed);
    }

    .cal-cell.is-selected .cal-dot {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.92);
    }

    .cal-legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-hatch {
      width: 13px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid #9CA3AF;
      background-color: #F3F4F6;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(107, 114, 128, 0.28),
        rgba(107, 114, 128, 0.28) 2.5px,
        transparent 2.5px,
        transparent 5px
      );
    }

    /* Панель быстрых действий */
    .quick-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow-card);
    }

    .quick-date-wrap {
      min-width: 0;
    }

    .quick-date-label {
      margin: 0;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .quick-date-value {
      margin: 1px 0 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-date-today {
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 600;
      margin-left: 4px;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Плашка события в списке месяца/дня */
    .event-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }

    .event-card:active {
      transform: scale(0.99);
    }

    .event-card.is-dayoff-card {
      background: #FAFAFA;
    }

    .event-card.is-highlighted {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.14);
    }

    .date-badge {
      width: 46px;
      padding: 8px 4px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }

    .date-badge-num {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .date-badge-wd {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .event-card.is-highlighted .date-badge {
      background: var(--accent);
      border-color: var(--accent);
    }

    .event-card.is-highlighted .date-badge-num,
    .event-card.is-highlighted .date-badge-wd {
      color: #FFFFFF;
    }

    .date-badge.is-today-badge {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .date-badge.is-today-badge .date-badge-num,
    .date-badge.is-today-badge .date-badge-wd {
      color: var(--accent-hover);
    }

    .date-badge.is-dayoff-badge {
      background-color: #F3F4F6;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(107, 114, 128, 0.16),
        rgba(107, 114, 128, 0.16) 3px,
        transparent 3px,
        transparent 6px
      );
    }

    .event-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .event-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .event-time.muted {
      color: var(--text-secondary);
    }

    .event-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-meta {
      font-size: 11.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-meta span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      align-self: stretch;
      gap: 6px;
      flex-shrink: 0;
    }

    .price-hint {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .price-hint.paid {
      color: var(--delivered-dark);
    }

    /* ========================================================================
       5. ВКЛАДКА 2: В ОБРАБОТКЕ (ОЧЕРЕДЬ ПО ДЕДЛАЙНУ)
       ======================================================================== */
    .stats-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      box-shadow: var(--shadow-card);
    }

    .stat-box.alert {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .stat-label {
      margin: 0;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .stat-box.alert .stat-label {
      color: var(--danger);
    }

    .stat-val {
      margin: 4px 0 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-primary);
    }

    .stat-box.alert .stat-val {
      color: var(--danger);
    }

    .editing-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .editing-card.is-overdue {
      border-color: var(--danger-border);
      background: #FFFDFD;
    }

    .editing-card.is-urgent {
      border-color: var(--editing-border);
    }

    .editing-card-top {
      padding: 14px 15px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .editing-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .deadline-date-note {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .editing-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .editing-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .editing-detail-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .editing-detail-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-app);
      border: 1px solid var(--border);
    }

    .contact-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-copy-mini {
      height: 30px;
      padding: 0 9px;
      border-radius: 9px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-copy-mini:hover {
      color: var(--accent-hover);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .editing-balance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-secondary);
      padding-top: 2px;
    }

    .editing-balance-row strong {
      color: var(--accent-hover);
      font-weight: 700;
    }

    .editing-card-footer {
      padding: 11px 15px 14px;
      border-top: 1px solid var(--border);
    }

    /* КРИТИЧНО: одна полноразмерная контурная кнопка «Отдано» на прозрачном фоне */
    .btn-deliver-outline {
      width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 14px;
      background: transparent;
      border: 1.5px solid #F97316;
      color: #F97316;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-deliver-outline .icon-checked {
      display: none;
    }

    .btn-deliver-outline:hover,
    .btn-deliver-outline:active {
      background: #F97316;
      border-color: #F97316;
      color: #FFFFFF;
    }

    .btn-deliver-outline:hover .icon-unchecked,
    .btn-deliver-outline:active .icon-unchecked {
      display: none;
    }

    .btn-deliver-outline:hover .icon-checked,
    .btn-deliver-outline:active .icon-checked {
      display: block;
    }

    /* ========================================================================
       6. ВКЛАДКА 3: ФИНАНСЫ (СВОДКА + РАЗБИВКА ПО СТАТУСАМ + БЭКАП, БЕЗ КАРТОЧЕК)
       ======================================================================== */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 4px;
    }

    .month-bar-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .kpi-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-card {
      border-radius: var(--radius-md);
      padding: 11px 10px;
      border: 1px solid var(--border);
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .kpi-card.kpi-total {
      background: #18181A;
      border-color: #18181A;
      color: #FFFFFF;
    }

    .kpi-card.kpi-paid {
      background: var(--delivered-bg);
      border-color: var(--delivered-border);
    }

    .kpi-card.kpi-rem {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .kpi-label {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .kpi-card.kpi-total .kpi-label { color: #A1A1AA; }
    .kpi-card.kpi-paid .kpi-label  { color: var(--delivered-dark); }
    .kpi-card.kpi-rem .kpi-label   { color: var(--accent-hover); }

    .kpi-val {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-card.kpi-total .kpi-val { color: #FFFFFF; }
    .kpi-card.kpi-paid .kpi-val  { color: var(--delivered-dark); }
    .kpi-card.kpi-rem .kpi-val   { color: var(--accent-hover); }

    .progress-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .progress-meta strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-subtle);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--delivered);
      transition: width 0.25s ease;
    }

    /* Агрегированные строки разбивки по статусам */
    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .breakdown-row {
      width: 100%;
      text-align: left;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-app);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .breakdown-row:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .breakdown-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .breakdown-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .breakdown-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .breakdown-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    .breakdown-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .breakdown-nums {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .breakdown-total {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .breakdown-rem {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-hover);
    }

    .breakdown-rem.zero {
      color: var(--delivered-dark);
    }

    .backup-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .danger-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ========================================================================
       7. ВКЛАДКА 4: АРХИВ (ТОЛЬКО «ОТДАНО», ПОИСК, ФИЛЬТРЫ, ГРУППИРОВКА)
       ======================================================================== */
    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px 10px 38px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.14);
    }

    .chips-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 8px 13px;
      border-radius: 11px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .archive-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 2px;
    }

    .archive-group-title {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .archive-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .archive-card:active {
      transform: scale(0.99);
    }

    .archive-card-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .archive-card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .archive-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .archive-card-footer {
      padding-top: 9px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* ========================================================================
       8. МОДАЛЬНЫЕ ОКНА (BOTTOM SHEET), ПОДТВЕРЖДЕНИЕ И TOAST
       ======================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(24, 24, 26, 0.48);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.16s ease-out;
    }

    @media (min-width: 520px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 92dvh;
      background: #FFFFFF;
      border-radius: 24px 24px 0 0;
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (min-width: 520px) {
      .sheet {
        border-radius: 24px;
      }
    }

    .sheet-header {
      padding: 10px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: #D1D5DB;
      margin: 0 auto 10px;
    }

    @media (min-width: 520px) {
      .sheet-handle { display: none; }
    }

    .sheet-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sheet-title {
      margin: 0;
      font-size: 16.5px;
      font-weight: 700;
    }

    .sheet-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sheet-footer {
      padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
    }

    .input:focus {
      background: #FFFFFF;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.14);
    }

    textarea.input {
      min-height: 78px;
      resize: vertical;
      line-height: 1.45;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .format-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-chip {
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
    }

    .mini-chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-hover);
    }

    .status-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 4px;
      border-radius: 14px;
      background: var(--bg-app);
      border: 1px solid var(--border);
    }

    .status-opt {
      min-height: 38px;
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .status-opt.active-confirmed { background: var(--confirmed); color: #FFFFFF; }
    .status-opt.active-editing   { background: var(--editing);   color: #FFFFFF; }
    .status-opt.active-delivered { background: var(--delivered); color: #FFFFFF; }

    .conflict-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 14px;
      padding: 11px 12px;
      color: var(--danger);
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .conflict-title {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .finance-panel {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .finance-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 700;
    }

    .btn-paid-toggle {
      width: 100%;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 11px;
      background: #FFFFFF;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-paid-toggle.is-paid {
      background: var(--delivered-bg);
      border-color: var(--delivered);
      color: var(--delivered-dark);
    }

    .input-with-btn {
      display: flex;
      gap: 8px;
    }

    .input-with-btn .input {
      flex: 1;
      min-width: 0;
    }

    .deadline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .deadline-presets {
      display: flex;
      gap: 4px;
    }

    .preset-btn {
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .preset-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-hover);
    }

    /* Диалог подтверждения (замена alert/confirm) */
    .confirm-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(24, 24, 26, 0.52);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.14s ease-out;
    }

    .confirm-box {
      width: 100%;
      max-width: 340px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn 0.16s ease-out;
    }

    .confirm-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .confirm-msg {
      margin: 0;

      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Всплывающие уведомления (Toast + Undo) */
    .toast-wrap {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      z-index: 60;
      width: calc(100% - 28px);
      max-width: 450px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      pointer-events: auto;
      background: #18181A;
      color: #FFFFFF;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13.5px;
      font-weight: 500;
      animation: popIn 0.18s ease-out;
    }

    .toast.is-error {
      background: var(--danger);
    }

    .toast-action {
      padding: 6px 11px;
      border-radius: 9px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .toast-action:hover {
      background: var(--accent-hover);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

  <script>
    (function () {
      'use strict';

      /* ======================================================================
         1. КОНСТАНТЫ И РУССКАЯ ЛОКАЛИЗАЦИЯ
         ====================================================================== */
      const STORAGE_KEY_EVENTS = 'photocal_pwa_v7_events';
      const STORAGE_KEY_INIT   = 'photocal_pwa_v7_initialized';

      const MONTHS_NOM = [
        'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
        'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
      ];

      const MONTHS_GEN = [
        'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
        'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
      ];

      const WEEKDAYS_HEADER = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const WEEKDAYS_JS     = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

      const FORMAT_CHIPS = ['Репортаж', 'Концерт', 'Корпоратив', 'Танцы', 'День рождения', 'Портрет'];
      const DAYOFF_CHIPS = ['Выходной', 'Отдых', 'Личные дела', 'Поездка'];

      /* ======================================================================
         2. БЕЗОПАСНОЕ ХРАНИЛИЩЕ (localStorage + IN-MEMORY FALLBACK)
         ====================================================================== */
      const memoryStorage = Object.create(null);

      function storageGet(key) {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            return window.localStorage.getItem(key);
          }
        } catch (err) {
          /* переход на fallback в памяти */
        }
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : null;
      }

      function storageSet(key, value) {
        memoryStorage[key] = String(value);
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(key, String(value));
          }
        } catch (err) {
          /* данные уже сохранены в memoryStorage */
        }
      }

      /* ======================================================================
         3. УТИЛИТЫ ЛОКАЛЬНЫХ ДАТ (БЕЗ toISOString ДЛЯ ИСКЛЮЧЕНИЯ СДВИГОВ ЧП)
         ====================================================================== */
      function formatLocalDate(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }

      function getTodayStr() {
        return formatLocalDate(new Date());
      }

      function parseLocalDate(str) {
        if (!str || typeof str !== 'string') return null;
        const parts = str.split('-').map(Number);
        if (parts.length !== 3 || parts.some(function (n) { return isNaN(n); })) return null;
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function addDaysLocal(str, delta) {
        const dt = parseLocalDate(str) || new Date();
        return formatLocalDate(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + delta));
      }

      function getDaysDiffFromToday(targetStr) {
        const today = parseLocalDate(getTodayStr());
        const target = parseLocalDate(targetStr);
        if (!today || !target) return null;
        return Math.round((target.getTime() - today.getTime()) / (24 * 60 * 60 * 1000));
      }

      function formatDateRu(str, includeYear) {
        const dt = parseLocalDate(str);
        if (!dt) return '—';
        const base = dt.getDate() + ' ' + MONTHS_GEN[dt.getMonth()];
        return includeYear ? (base + ' ' + dt.getFullYear()) : base;
      }

      function formatDateWithWeekday(str) {
        const dt = parseLocalDate(str);
        if (!dt) return '—';
        return dt.getDate() + ' ' + MONTHS_GEN[dt.getMonth()] + ', ' + WEEKDAYS_JS[dt.getDay()];
      }

      function getMonthKey(year, monthIdx) {
        return year + '-' + String(monthIdx + 1).padStart(2, '0');
      }

      /* ======================================================================
         4. ОБЩИЕ УТИЛИТЫ (ЭКРАНИРОВАНИЕ, ФОРМАТИРОВАНИЕ, КОНФЛИКТЫ, БУФЕР)
         ====================================================================== */
      function escapeHtml(val) {
        if (val === null || val === undefined) return '';
        return String(val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function pluralize(n, forms) {
        const abs = Math.abs(n) % 100;
        const last = abs % 10;
        if (abs > 10 && abs < 20) return forms[2];
        if (last > 1 && last < 5) return forms[1];
        if (last === 1) return forms[0];
        return forms[2];
      }

      function formatRub(amount) {
        const num = Math.max(0, Math.round(Number(amount) || 0));
        return num.toLocaleString('ru-RU') + ' ₽';
      }

      function generateId() {
        return 'ev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      }

      function calcFinance(ev) {
        const total = Math.max(0, Number(ev.totalPrice) || 0);
        const paid = ev.isPaidFull ? total : Math.min(total, Math.max(0, Number(ev.prepayment) || 0));
        const remaining = Math.max(0, total - paid);
        return { total: total, paid: paid, remaining: remaining };
      }

      function timeToMinutes(t) {
        if (!t || typeof t !== 'string' || t.indexOf(':') === -1) return null;
        const parts = t.split(':').map(Number);
        if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
        return parts[0] * 60 + parts[1];
      }

      function sortChronologically(arr) {
        return arr.slice().sort(function (a, b) {
          const d = (a.date || '').localeCompare(b.date || '');
          if (d !== 0) return d;
          if (a.type === 'dayoff' && b.type !== 'dayoff') return -1;
          if (a.type !== 'dayoff' && b.type === 'dayoff') return 1;
          return (a.startTime || '99:99').localeCompare(b.startTime || '99:99');
        });
      }

       * Проверка пересечений по времени ТОЛЬКО с подтверждёнными съёмками и выходными на указанную дату.
       */
      function detectScheduleConflicts(params) {
        const date = params.date;
        if (!date) return [];

        const sameDayActive = state.events.filter(function (e) {
          if (e.date !== date || e.id === params.excludeId) return false;
          return e.type === 'dayoff' || (e.type === 'shoot' && e.status === 'confirmed');
        });

        const warnings = [];
        const sNew = timeToMinutes(params.startTime);
        const eNew = timeToMinutes(params.endTime);

        for (let i = 0; i < sameDayActive.length; i++) {
          const ex = sameDayActive[i];
          if (ex.type === 'dayoff') {
            warnings.push('Эта дата закрыта как выходной: «' + (ex.title || 'Выходной') + '».');
            continue;
          }
          if (params.isDayOff) {
            const tm = ex.startTime ? (' (' + ex.startTime + (ex.endTime ? '–' + ex.endTime : '') + ')') : '';
            warnings.push('На эту дату уже подтверждена съёмка: «' + ex.title + '»' + tm + '.');
            continue;
          }
          const sEx = timeToMinutes(ex.startTime);
          const eEx = timeToMinutes(ex.endTime);
          if (sNew !== null && eNew !== null && sEx !== null && eEx !== null) {
            if (sNew < eEx && sEx < eNew) {
              warnings.push('Пересечение по времени со съёмкой «' + ex.title + '» (' + ex.startTime + '–' + ex.endTime + ').');
            }
          } else if (sNew !== null && sEx !== null && sNew === sEx) {
            warnings.push('Совпадает время начала со съёмкой «' + ex.title + '» (' + ex.startTime + ').');
          }
        }
        return warnings;
      }

      /* Надёжное копирование в буфер обмена через document.execCommand('copy') */
      function copyToClipboard(text, successMsg) {
        if (!text) return;
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) showToast(successMsg || 'Скопировано в буфер');
          else showToast('Не удалось скопировать', 'error');
