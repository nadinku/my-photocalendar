            notes: 'Интерьер, бариста, гости. Ссылка на облако отправлена.',
            isDemo: true,
          },
          {
            id: 'demo-arch-3',
            type: 'shoot',
            title: 'Концерт: камерный оркестр при свечах',
            status: 'delivered',
            date: dArchPrev2,
            startTime: '20:00',
            endTime: '22:00',
            location: 'Особняк «Модерн», большой зал',
            contact: 'Виктория @vika_music',
            totalPrice: 21000,
            prepayment: 21000,
            isPaidFull: true,
            deadline: addDaysLocal(dArchPrev2, 6),
            notes: 'Полный сет в облаке, клиент очень доволен.',
            isDemo: true,
          },
        ];
      }

      /* ======================================================================
         6. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
         ====================================================================== */
      const nowInit = new Date();
      const state = {
        events: [],
        activeTab: 'calendar',        // 'calendar' | 'editing' | 'finance' | 'archive'
        viewYear: nowInit.getFullYear(),
        viewMonth: nowInit.getMonth(),
        selectedDate: getTodayStr(),
        calListMode: 'month',         // 'month' | 'day'
        financePeriodMode: 'month',   // 'month' | 'all'
        financeYear: nowInit.getFullYear(),
        financeMonth: nowInit.getMonth(),
        archiveSearch: '',
        archivePayFilter: 'all',      // 'all' | 'paid' | 'unpaid'
      };

      function saveEvents() {
        storageSet(STORAGE_KEY_EVENTS, JSON.stringify(state.events));
      }

      function loadEvents() {
        const initialized = storageGet(STORAGE_KEY_INIT);
        const raw = storageGet(STORAGE_KEY_EVENTS);
        if (!initialized && !raw) {
          state.events = createDynamicDemoData();
          saveEvents();
          storageSet(STORAGE_KEY_INIT, '1');
          return;
        }
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              state.events = parsed;
              return;
            }
          } catch (err) {
            /* некорректный JSON — начинаем с чистого списка */
          }
        }
        state.events = [];
      }

      function injectPwaManifest() {
        try {
          const manifest = {
            name: 'ФотоКалендарь — Личный график фотографа',
            short_name: 'ФотоКалендарь',
            start_url: '.',
            display: 'standalone',
            background_color: '#F7F7F5',
            theme_color: '#F7F7F5',
            lang: 'ru',
          };
          const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = URL.createObjectURL(blob);
          document.head.appendChild(link);
        } catch (err) {
          /* не критично внутри изолированного iframe */
        }
      }

      /* ======================================================================
         7. TOAST-УВЕДОМЛЕНИЯ (С КНОПКОЙ «ОТМЕНИТЬ») И ДИАЛОГ ПОДТВЕРЖДЕНИЯ
         ====================================================================== */
      function showToast(message, type, action, duration) {
        const root = document.getElementById('toast-root');
        const el = document.createElement('div');
        el.className = 'toast' + (type === 'error' ? ' is-error' : '');

        const textSpan = document.createElement('span');
        textSpan.textContent = message;
        el.appendChild(textSpan);

        let timer = null;
        function removeToast() {
          if (timer) clearTimeout(timer);
          el.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
          el.style.opacity = '0';
          el.style.transform = 'translateY(8px)';
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 200);
        }

        if (action && typeof action.onClick === 'function') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'toast-action';
          btn.textContent = action.label || 'Отменить';
          btn.addEventListener('click', function () {
            action.onClick();
            removeToast();
          });
          el.appendChild(btn);
        }

        root.appendChild(el);
        const ms = action ? Math.max(5000, duration || 5000) : (duration || 3200);
        timer = setTimeout(removeToast, ms);
      }

      function openConfirm(opts) {
        const root = document.getElementById('confirm-root');
        root.classList.remove('hidden');
        const okCls = opts.danger ? 'btn-danger-soft' : 'btn-primary';

        root.innerHTML =
          '<div class="confirm-box">' +
            '<h3 class="confirm-title">' + escapeHtml(opts.title) + '</h3>' +
            '<p class="confirm-msg">' + escapeHtml(opts.message) + '</p>' +
            '<div class="grid-2">' +
              '<button id="c-cancel" type="button" class="btn-secondary" style="min-height:44px">Отмена</button>' +
              '<button id="c-ok" type="button" class="' + okCls + '">' + escapeHtml(opts.confirmText || 'Подтвердить') + '</button>' +
            '</div>' +
          '</div>';

        function close() {
          root.classList.add('hidden');
          root.innerHTML = '';
        }

        root.onclick = function (e) { if (e.target === root) close(); };
        document.getElementById('c-cancel').onclick = close;
        document.getElementById('c-ok').onclick = function () {
          close();
          if (typeof opts.onConfirm === 'function') opts.onConfirm();
        };
      }

      /* ======================================================================
         8. ОБНОВЛЕНИЕ ШАПКИ, БЕЙДЖА И РОУТИНГ 4 ВКЛАДОК
         ====================================================================== */
      function switchTab(tabName) {
        state.activeTab = tabName;
        renderApp();
        window.scrollTo(0, 0);
      }

      function updateChrome() {
        const editingCount = state.events.filter(function (e) {
          return e.type === 'shoot' && e.status === 'editing';
        }).length;

        const archiveCount = state.events.filter(function (e) {
          return e.type === 'shoot' && e.status === 'delivered';
        }).length;

        const badge = document.getElementById('editing-badge');
        if (editingCount > 0) {
          badge.textContent = editingCount > 99 ? '99+' : String(editingCount);
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }

        const titleEl = document.getElementById('header-title');
        const subEl = document.getElementById('header-subtitle');

        if (state.activeTab === 'calendar') {
          titleEl.textContent = 'ФотоКалендарь';
          subEl.textContent = 'Подтверждённые съёмки и выходные';
        } else if (state.activeTab === 'editing') {
          titleEl.textContent = 'В обработке';
          subEl.textContent = editingCount > 0
            ? ('В очереди: ' + editingCount + ' ' + pluralize(editingCount, ['съёмка', 'съёмки', 'съёмок']))
            : 'Очередь обработки пуста';
        } else if (state.activeTab === 'finance') {
          titleEl.textContent = 'Финансы';
          subEl.textContent = 'Сводка доходов и резервная копия';
        } else {
          titleEl.textContent = 'Архив';
          subEl.textContent = archiveCount > 0
            ? ('Отдано: ' + archiveCount + ' ' + pluralize(archiveCount, ['съёмка', 'съёмки', 'съёмок']))
            : 'Отданные съёмки';
        }

        document.querySelectorAll('.nav-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === state.activeTab);
        });
      }

      function renderApp(opts) {
        updateChrome();
        const main = document.getElementById('app-main');
        if (state.activeTab === 'calendar') {
          renderCalendarTab(main, opts || {});
        } else if (state.activeTab === 'editing') {
          renderEditingTab(main);
        } else if (state.activeTab === 'finance') {
          renderFinanceTab(main);
        } else {
          renderArchiveTab(main);
        }
      }

      /* ======================================================================
         9. ВКЛАДКА 1: КАЛЕНДАРЬ (СТРОГО ТОЛЬКО «ПОДТВЕРЖДЕНО» И «ВЫХОДНОЙ»)
         ====================================================================== */
      function getCalendarEvents() {
        return state.events.filter(function (e) {
          return e.type === 'dayoff' || (e.type === 'shoot' && e.status === 'confirmed');
        });
      }

      function renderCalendarTab(container, opts) {
        const todayStr = getTodayStr();
        const year = state.viewYear;
        const month = state.viewMonth;
        const monthKey = getMonthKey(year, month);
        const monthTitle = MONTHS_NOM[month] + ' ' + year;

        const firstDay = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7; // Пн = 0 ... Вс = 6

        // СТРОГО: только «Подтверждено» и «Выходной» за отображаемый месяц
        const calendarMonthEvents = sortChronologically(
          getCalendarEvents().filter(function (e) {
            return e.date && e.date.indexOf(monthKey) === 0;
          })
        );

        const byDate = Object.create(null);
        for (let i = 0; i < calendarMonthEvents.length; i++) {
          const ev = calendarMonthEvents[i];
          if (!byDate[ev.date]) byDate[ev.date] = [];
          byDate[ev.date].push(ev);
        }

        let cellsHtml = '';
        for (let empty = 0; empty < startOffset; empty++) {
          cellsHtml += '<div></div>';
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const iso = monthKey + '-' + String(day).padStart(2, '0');
          const dayEvs = byDate[iso] || [];
          const hasDayOff = dayEvs.some(function (e) { return e.type === 'dayoff'; });
          const confirmedCount = dayEvs.filter(function (e) { return e.type === 'shoot' && e.status === 'confirmed'; }).length;

          // В ячейках ТОЛЬКО синие точки для «Подтверждено» и серая штриховка для «Выходной»
          const dotsCount = Math.min(confirmedCount, 4);
          let dotsHtml = '<div class="cal-dots">';
          for (let d = 0; d < dotsCount; d++) {
            dotsHtml += '<span class="cal-dot dot-confirmed"></span>';
          }
          dotsHtml += '</div>';

          let cls = 'cal-cell';
          if (hasDayOff) cls += ' is-dayoff';
          if (iso === todayStr) cls += ' is-today';
          if (iso === state.selectedDate) cls += ' is-selected';

          cellsHtml +=
            '<button type="button" class="' + cls + '" data-cal-day="' + iso + '" aria-label="' + formatDateRu(iso, false) + '">' +
              '<span class="cal-day-num">' + day + '</span>' +
              dotsHtml +
            '</button>';
        }

        const isMonthMode = state.calListMode === 'month';
        const listEvents = isMonthMode
          ? calendarMonthEvents
          : sortChronologically(
              getCalendarEvents().filter(function (e) { return e.date === state.selectedDate; })
            );

        const countText = listEvents.length + ' ' + pluralize(listEvents.length, ['событие', 'события', 'событий']);
        const listHeading = isMonthMode
          ? ('План на ' + MONTHS_NOM[month].toLowerCase())
          : ('События · ' + formatDateWithWeekday(state.selectedDate));

        const listHtml = listEvents.length > 0
          ? listEvents.map(function (ev) {
              return renderCalendarEventCard(ev, ev.date === state.selectedDate, todayStr);
            }).join('')
          : '<div class="empty-state">' +
              '<div class="empty-icon">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                  '<rect x="3" y="4" width="18" height="18" rx="2"></rect>' +
                  '<line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>' +
                '</svg>' +
              '</div>' +
              '<p class="empty-title">' + (isMonthMode ? 'На этот месяц пока свободно' : 'Этот день свободен') + '</p>' +
              '<p class="empty-desc">Добавьте подтверждённую съёмку или закройте дату как выходной.</p>' +
            '</div>';

        container.innerHTML =
          '<section class="card">' +
            '<div class="cal-header">' +
              '<div class="cal-month-nav">' +
                '<button id="cal-prev" type="button" class="icon-btn" aria-label="Предыдущий месяц">' +
                  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>' +
                '</button>' +
                '<h2 class="cal-month-title">' + monthTitle + '</h2>' +
                '<button id="cal-next" type="button" class="icon-btn" aria-label="Следующий месяц">' +
                  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>' +
                '</button>' +
              '</div>' +
              '<button id="cal-today" type="button" class="btn-today">Сегодня</button>' +
            '</div>' +

            '<div class="cal-weekdays">' +
              WEEKDAYS_HEADER.map(function (wd, idx) {
                return '<div class="cal-wd' + (idx >= 5 ? ' weekend' : '') + '">' + wd + '</div>';
              }).join('') +
            '</div>' +

            '<div class="cal-grid">' + cellsHtml + '</div>' +

            '<div class="cal-legend">' +
              '<span class="legend-item"><span class="cal-dot dot-confirmed"></span>Подтверждено</span>' +
              '<span class="legend-item"><span class="legend-hatch"></span>Выходной</span>' +
            '</div>' +
          '</section>' +

          '<section class="quick-bar">' +
            '<div class="quick-date-wrap">' +
              '<p class="quick-date-label">Выбранная дата</p>' +
              '<p class="quick-date-value">' +
                formatDateWithWeekday(state.selectedDate) +
                (state.selectedDate === todayStr ? '<span class="quick-date-today">· сегодня</span>' : '') +
              '</p>' +
            '</div>' +
            '<div class="quick-actions">' +
              '<button id="quick-shoot" type="button" class="btn-primary-sm">+ Съёмка</button>' +
              '<button id="quick-dayoff" type="button" class="btn-secondary">Выходной</button>' +
            '</div>' +
          '</section>' +

          '<section class="stack">' +
            '<div class="section-head">' +
              '<div>' +
                '<h3 class="section-title">' + listHeading + '</h3>' +
                '<p class="section-sub">' + countText + '</p>' +
              '</div>' +
              '<div class="segmented">' +
                '<button type="button" class="segmented-btn' + (isMonthMode ? ' active' : '') + '" data-cal-mode="month">Весь месяц</button>' +
                '<button type="button" class="segmented-btn' + (!isMonthMode ? ' active' : '') + '" data-cal-mode="day">День</button>' +
              '</div>' +
            '</div>' +
            '<div class="stack">' + listHtml + '</div>' +
          '</section>';

        // Навигация по месяцам
        document.getElementById('cal-prev').onclick = function () {
          if (state.viewMonth === 0) { state.viewMonth = 11; state.viewYear--; }
          else state.viewMonth--;
          syncSelectedDateToMonth();
          renderApp();
        };

        document.getElementById('cal-next').onclick = function () {
          if (state.viewMonth === 11) { state.viewMonth = 0; state.viewYear++; }
          else state.viewMonth++;
          syncSelectedDateToMonth();
          renderApp();
        };

        document.getElementById('cal-today').onclick = function () {
          const t = new Date();
          state.viewYear = t.getFullYear();
          state.viewMonth = t.getMonth();
          state.selectedDate = formatLocalDate(t);
          renderApp({ scrollToSelected: true });
        };

        // Быстрые кнопки добавления на выбранную дату
        document.getElementById('quick-shoot').onclick = function () {
          openShootModal(null, state.selectedDate);
        };
        document.getElementById('quick-dayoff').onclick = function () {
          openDayOffModal(null, state.selectedDate);
        };

        // Переключатель «Весь месяц / День»
        container.querySelectorAll('[data-cal-mode]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.calListMode = btn.getAttribute('data-cal-mode');
            renderApp();
          });
        });

        // Клик по дате в сетке: режим «Весь месяц» остаётся активным, подсвечиваем и прокручиваем
        container.querySelectorAll('[data-cal-day]').forEach(function (cell) {
          cell.addEventListener('click', function () {
            state.selectedDate = cell.getAttribute('data-cal-day');
            renderApp({ scrollToSelected: state.calListMode === 'month' });
          });
        });

        bindCardOpeners(container);

        if (opts.scrollToSelected && state.calListMode === 'month') {
          requestAnimationFrame(function () {
            const firstMatch = container.querySelector('[data-event-date="' + state.selectedDate + '"]');
            if (firstMatch && typeof firstMatch.scrollIntoView === 'function') {
              firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          });
        }
      }

      function syncSelectedDateToMonth() {
        const todayStr = getTodayStr();
        const key = getMonthKey(state.viewYear, state.viewMonth);
        if (todayStr.indexOf(key) === 0) {
          state.selectedDate = todayStr;
        } else if (state.selectedDate.indexOf(key) !== 0) {
          state.selectedDate = key + '-01';
        }
      }

      function renderCalendarEventCard(ev, isHighlighted, todayStr) {
        const dt = parseLocalDate(ev.date);
        const dayNum = dt ? dt.getDate() : '—';
        const wd = dt ? WEEKDAYS_JS[dt.getDay()] : '';
        const isDayOff = ev.type === 'dayoff';
        const isToday = ev.date === todayStr;

        const timeLabel = isDayOff
          ? 'Весь день'
          : (ev.startTime ? (ev.startTime + (ev.endTime ? '–' + ev.endTime : '')) : 'Время не указано');

        let cardCls = 'event-card';
        if (isDayOff) cardCls += ' is-dayoff-card';
        if (isHighlighted) cardCls += ' is-highlighted';

        let badgeCls = 'date-badge';
        if (!isHighlighted && isToday) badgeCls += ' is-today-badge';
        else if (!isHighlighted && isDayOff) badgeCls += ' is-dayoff-badge';

        let paymentHtml = '';
        if (!isDayOff) {
          const fin = calcFinance(ev);
          if (fin.total > 0 && fin.remaining > 0) {
            paymentHtml = '<span class="price-hint">ост. ' + formatRub(fin.remaining) + '</span>';
          } else if (fin.total > 0 && fin.remaining === 0) {
            paymentHtml = '<span class="price-hint paid">Оплачено</span>';
          }
        }

        const pillHtml = isDayOff
          ? '<span class="pill pill-dayoff">Выходной</span>'
          : '<span class="pill pill-confirmed">Подтверждено</span>';

        const subLine = (!isDayOff && ev.location)
          ? '<div class="event-meta">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">' +
                '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>' +
              '</svg>' +
              '<span>' + escapeHtml(ev.location) + '</span>' +
            '</div>'
          : '';

        return (
          '<article class="' + cardCls + '" data-open-id="' + ev.id + '" data-event-date="' + ev.date + '">' +
            '<div class="' + badgeCls + '">' +
              '<span class="date-badge-num">' + dayNum + '</span>' +
              '<span class="date-badge-wd">' + wd + '</span>' +
            '</div>' +
            '<div class="event-body">' +
              '<div class="event-time' + (isDayOff ? ' muted' : '') + '">' +
                '<span>' + escapeHtml(timeLabel) + '</span>' +
                (isToday ? '<span style="color:var(--accent);font-size:10.5px">· сегодня</span>' : '') +
              '</div>' +
              '<h4 class="event-title">' + escapeHtml(ev.title || 'Выходной') + '</h4>' +
              subLine +
            '</div>' +
            '<div class="event-right">' +
              pillHtml +
              paymentHtml +
            '</div>' +
          '</article>'
        );
      }

      /* ======================================================================
         10. ВКЛАДКА 2: В ОБРАБОТКЕ (СТРОГО ТОЛЬКО СТАТУС «В ОБРАБОТКЕ»)
         ====================================================================== */
      function renderEditingTab(container) {
        const queue = state.events
          .filter(function (e) { return e.type === 'shoot' && e.status === 'editing'; })
          .sort(function (a, b) {
            if (!a.deadline && !b.deadline) return (a.date || '').localeCompare(b.date || '');
            if (!a.deadline) return 1;
            if (!b.deadline) return -1;
            return a.deadline.localeCompare(b.deadline);
          });

        if (queue.length === 0) {
          container.innerHTML =
            '<div class="empty-state" style="margin-top:8px">' +
              '<div class="empty-icon" style="background:var(--delivered-bg);color:var(--delivered-dark)">' +
                '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' +
                '</svg>' +
              '</div>' +
              '<p class="empty-title">Очередь обработки пуста</p>' +
              '<p class="empty-desc">Все отснятые заказы уже отданы и находятся во вкладке «Архив».</p>' +
            '</div>';
          return;
        }

        const urgentCount = queue.filter(function (ev) {
          const diff = getDaysDiffFromToday(ev.deadline);
          return diff !== null && diff <= 2;
        }).length;

        const cardsHtml = queue.map(function (ev) {
          const diff = getDaysDiffFromToday(ev.deadline);
          const isOverdue = diff !== null && diff < 0;
          const isTodayDl = diff === 0;
          const isSoon = diff !== null && diff > 0 && diff <= 2;

          let dlLabel = 'Без дедлайна';
          let dlPillCls = 'pill-neutral';
          if (diff !== null) {
            if (isOverdue) {
              dlLabel = 'Просрочено на ' + Math.abs(diff) + ' дн.';
              dlPillCls = 'pill-danger';
            } else if (isTodayDl) {
              dlLabel = 'Сегодня дедлайн';
              dlPillCls = 'pill-danger';
            } else if (isSoon) {
              dlLabel = 'Осталось ' + diff + ' дн.';
              dlPillCls = 'pill-editing';
            } else {
              dlLabel = 'Осталось ' + diff + ' дн.';
              dlPillCls = 'pill-neutral';
            }
          }

          let cardCls = 'editing-card';
          if (isOverdue || isTodayDl) cardCls += ' is-overdue';
          else if (isSoon) cardCls += ' is-urgent';

          const fin = calcFinance(ev);

          return (
            '<article class="' + cardCls + '">' +
              '<div class="editing-card-top" data-open-id="' + ev.id + '">' +
                '<div class="editing-badges">' +
                  '<span class="pill pill-editing">В обработке</span>' +
                  '<span class="pill ' + dlPillCls + '">' + dlLabel + '</span>' +
                  (ev.deadline ? '<span class="deadline-date-note">до ' + formatDateRu(ev.deadline, false) + '</span>' : '') +
                '</div>' +

                '<h3 class="editing-title">' + escapeHtml(ev.title) + '</h3>' +

                '<div class="editing-details">' +
                  '<div class="editing-detail-row">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>' +
                    '<span>Дата съёмки: ' + formatDateRu(ev.date, true) + '</span>' +
                  '</div>' +
                  (ev.location
                    ? '<div class="editing-detail-row">' +
                        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>' +
                        '<span>' + escapeHtml(ev.location) + '</span>' +
                      '</div>'
                    : '') +
                '</div>' +

                (ev.contact
                  ? '<div class="contact-row">' +
                      '<span class="contact-text">' + escapeHtml(ev.contact) + '</span>' +
                      '<button type="button" class="btn-copy-mini" data-copy-contact="' + escapeHtml(ev.contact) + '">' +
                        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
                        '<span>Копировать</span>' +
                      '</button>' +
                    '</div>'
                  : '') +

                (fin.remaining > 0
                  ? '<div class="editing-balance-row"><span>Остаток оплаты</span><strong>' + formatRub(fin.remaining) + '</strong></div>'
                  : '') +
              '</div>' +

              '<div class="editing-card-footer">' +
                '<button type="button" class="btn-deliver-outline" data-deliver-id="' + ev.id + '">' +
                  '<svg class="icon-unchecked" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                    '<circle cx="12" cy="12" r="9"></circle>' +
                  '</svg>' +
                  '<svg class="icon-checked" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<circle cx="12" cy="12" r="9"></circle>' +
                    '<polyline points="8.5 12.5 11 15 16 9.5"></polyline>' +
                  '</svg>' +
                  '<span>Отдано</span>' +
                '</button>' +
              '</div>' +
            '</article>'
          );
        }).join('');

        container.innerHTML =
          '<section class="stats-grid-2">' +
            '<div class="stat-box">' +
              '<p class="stat-label" style="color:var(--editing)">В обработке</p>' +
              '<p class="stat-val">' + queue.length + '</p>' +
            '</div>' +
            '<div class="stat-box' + (urgentCount > 0 ? ' alert' : '') + '">' +
              '<p class="stat-label">Срочные (≤ 2 дн.)</p>' +
              '<p class="stat-val">' + urgentCount + '</p>' +
            '</div>' +
          '</section>' +
          '<div class="stack">' + cardsHtml + '</div>';

        // Копирование контакта
        container.querySelectorAll('[data-copy-contact]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            copyToClipboard(btn.getAttribute('data-copy-contact'), 'Контакт скопирован');
          });
        });

        // Перевод в «Отдано» (перенос в Архив) с Undo на 5 секунд
        container.querySelectorAll('[data-deliver-id]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const id = btn.getAttribute('data-deliver-id');
            const ev = state.events.find(function (item) { return item.id === id; });
            if (!ev) return;
            ev.status = 'delivered';
            saveEvents();
            renderApp();
            showToast('Перенесено в Архив', 'default', {
              label: 'Отменить',
              onClick: function () {
                ev.status = 'editing';
                saveEvents();
                renderApp();
              },
            }, 5000);
          });
        });

        bindCardOpeners(container);
      }

      /* ======================================================================
         11. ВКЛАДКА 3: ФИНАНСЫ (АНАЛИТИКА И БЭКАП, БЕЗ СПИСКА КАРТОЧЕК СЪЁМОК)
         ====================================================================== */
      function renderFinanceTab(container) {
        const isMonth = state.financePeriodMode === 'month';
        const periodKey = getMonthKey(state.financeYear, state.financeMonth);
        const periodLabel = MONTHS_NOM[state.financeMonth] + ' ' + state.financeYear;

        // Все съёмки периода (независимо от статуса — для полного учёта доходов)
        const periodShoots = state.events.filter(function (e) {
          if (e.type !== 'shoot') return false;
          if (!isMonth) return true;
          return e.date && e.date.indexOf(periodKey) === 0;
        });

        const totals = { count: 0, total: 0, paid: 0, remaining: 0 };
        const byStatus = {
          confirmed: { count: 0, total: 0, remaining: 0 },
          editing:   { count: 0, total: 0, remaining: 0 },
          delivered: { count: 0, total: 0, remaining: 0 },
        };

        for (let i = 0; i < periodShoots.length; i++) {
          const ev = periodShoots[i];
          const f = calcFinance(ev);
          totals.count++;
          totals.total += f.total;
          totals.paid += f.paid;
          totals.remaining += f.remaining;

          const bucket = byStatus[ev.status] || byStatus.confirmed;
          bucket.count++;
          bucket.total += f.total;
          bucket.remaining += f.remaining;
        }

        const paidPct = totals.total > 0 ? Math.round((totals.paid / totals.total) * 100) : 0;
        const hasDemo = state.events.some(function (e) { return e.isDemo; });

        const breakdownItems = [
          {
            key: 'confirmed',
            label: 'Подтверждено',
            pillCls: 'pill-confirmed',
            targetTab: 'calendar',
            hint: 'Открыть в Календаре',
            data: byStatus.confirmed,
          },
          {
            key: 'editing',
            label: 'В обработке',
            pillCls: 'pill-editing',
            targetTab: 'editing',
            hint: 'Открыть в Обработке',
            data: byStatus.editing,
          },
          {
            key: 'delivered',
            label: 'Отдано',
            pillCls: 'pill-delivered',
            targetTab: 'archive',
            hint: 'Открыть в Архиве',
            data: byStatus.delivered,
          },
        ];

        container.innerHTML =
          '<section class="card" style="display:flex;flex-direction:column;gap:12px">' +
            '<div class="section-head" style="padding:0">' +
              '<h2 class="section-title">Финансовая сводка</h2>' +
              '<div class="segmented">' +
                '<button type="button" class="segmented-btn' + (isMonth ? ' active' : '') + '" data-fin-period="month">За месяц</button>' +
                '<button type="button" class="segmented-btn' + (!isMonth ? ' active' : '') + '" data-fin-period="all">Всё время</button>' +
              '</div>' +
            '</div>' +

            (isMonth
              ? '<div class="month-bar">' +
                  '<button id="fin-prev" type="button" class="icon-btn" aria-label="Предыдущий месяц">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>' +
                  '</button>' +
                  '<span class="month-bar-label">' + periodLabel + '</span>' +
                  '<button id="fin-next" type="button" class="icon-btn" aria-label="Следующий месяц">' +
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>' +
                  '</button>' +
                '</div>'
              : '') +

            '<div class="kpi-grid-3">' +
              '<div class="kpi-card kpi-total">' +
                '<p class="kpi-label">Всего</p>' +
                '<p class="kpi-val">' + formatRub(totals.total) + '</p>' +
              '</div>' +
              '<div class="kpi-card kpi-paid">' +
                '<p class="kpi-label">Получено</p>' +
                '<p class="kpi-val">' + formatRub(totals.paid) + '</p>' +
              '</div>' +
              '<div class="kpi-card kpi-rem">' +
                '<p class="kpi-label">Остаток</p>' +
                '<p class="kpi-val">' + formatRub(totals.remaining) + '</p>' +
              '</div>' +
            '</div>' +

            '<div class="progress-block">' +
              '<div class="progress-meta">' +
                '<span>Оплачено по ' + totals.count + ' ' + pluralize(totals.count, ['съёмке', 'съёмкам', 'съёмкам']) + '</span>' +
                '<strong>' + paidPct + '%</strong>' +
              '</div>' +
              '<div class="progress-track"><div class="progress-fill" style="width:' + paidPct + '%"></div></div>' +
            '</div>' +
          '</section>' +

          '<section class="card" style="display:flex;flex-direction:column;gap:10px">' +
            '<div>' +
              '<h3 class="section-title" style="font-size:14.5px">Разбивка по статусам</h3>' +
              '<p class="section-sub">Нажмите на строку, чтобы перейти к нужной вкладке</p>' +
            '</div>' +
            '<div class="breakdown-list">' +
              breakdownItems.map(function (item) {
                const cnt = item.data.count;
                const remText = item.data.remaining > 0
                  ? ('ост. ' + formatRub(item.data.remaining))
                  : (cnt > 0 ? 'Оплачено' : '—');
                return (
                  '<button type="button" class="breakdown-row" data-go-tab="' + item.targetTab + '">' +
                    '<div class="breakdown-left">' +
                      '<div class="breakdown-title-row">' +
                        '<span class="pill ' + item.pillCls + '">' + item.label + '</span>' +
                        '<span class="breakdown-count">' + cnt + ' ' + pluralize(cnt, ['съёмка', 'съёмки', 'съёмок']) + '</span>' +
                      '</div>' +
                      '<span class="breakdown-hint">' + item.hint + '</span>' +
                    '</div>' +
                    '<div class="breakdown-right">' +
                      '<div class="breakdown-nums">' +
                        '<span class="breakdown-total">' + formatRub(item.data.total) + '</span>' +
                        '<span class="breakdown-rem' + (item.data.remaining === 0 ? ' zero' : '') + '">' + remText + '</span>' +
                      '</div>' +
                      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>' +
                    '</div>' +
                  '</button>'
                );
              }).join('') +
            '</div>' +
          '</section>' +

          '<section class="card" style="display:flex;flex-direction:column;gap:10px">' +
            '<div>' +
              '<h3 class="section-title" style="font-size:14.5px">Данные и резервная копия</h3>' +
              '<p class="section-sub">Записи хранятся локально на телефоне. Экспортируйте JSON для бэкапа.</p>' +
            '</div>' +
            '<div class="backup-grid">' +
              '<button id="btn-export-json" type="button" class="btn-primary" style="min-height:42px;font-size:13px">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
                '<span>Экспорт JSON</span>' +
              '</button>' +
              '<button id="btn-import-json" type="button" class="btn-secondary" style="min-height:42px;font-size:13px">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>' +
                '<span>Импорт JSON</span>' +
              '</button>' +
            '</div>' +
            '<div class="danger-actions-row">' +
              (hasDemo
                ? '<button id="btn-clear-demo" type="button" class="btn-outline-orange" style="flex:1">Очистить демо-данные</button>'
                : '') +
              '<button id="btn-clear-all" type="button" class="btn-danger-soft" style="min-height:40px;font-size:12.5px;flex:1">Очистить всё</button>' +
            '</div>' +
          '</section>';

        // Переключатель периода
        container.querySelectorAll('[data-fin-period]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.financePeriodMode = btn.getAttribute('data-fin-period');
            renderApp();
          });
        });

        const prevBtn = document.getElementById('fin-prev');
        if (prevBtn) {
          prevBtn.onclick = function () {
            if (state.financeMonth === 0) { state.financeMonth = 11; state.financeYear--; }
            else state.financeMonth--;
            renderApp();
          };
        }

        const nextBtn = document.getElementById('fin-next');
        if (nextBtn) {
          nextBtn.onclick = function () {
            if (state.financeMonth === 11) { state.financeMonth = 0; state.financeYear++; }
            else state.financeMonth++;
            renderApp();
          };
        }

        // Переходы по строкам разбивки
        container.querySelectorAll('[data-go-tab]').forEach(function (row) {
          row.addEventListener('click', function () {
            const target = row.getAttribute('data-go-tab');
            if (target === 'calendar' && isMonth) {
              state.viewYear = state.financeYear;
              state.viewMonth = state.financeMonth;
              syncSelectedDateToMonth();
            }
            switchTab(target);
          });
        });

        // Бэкап и очистка
        document.getElementById('btn-export-json').onclick = exportJsonBackup;
        document.getElementById('btn-import-json').onclick = function () {
          const inp = document.getElementById('json-import-input');
          inp.value = '';
          inp.click();
        };

        const clearDemoBtn = document.getElementById('btn-clear-demo');
        if (clearDemoBtn) {
          clearDemoBtn.onclick = function () {
            openConfirm({
              title: 'Очистить демо-данные?',
              message: 'Все тестовые записи будут удалены. Ваши собственные съёмки и выходные сохранятся.',
              confirmText: 'Очистить',
              danger: true,
              onConfirm: function () {
                state.events = state.events.filter(function (e) { return !e.isDemo; });
                saveEvents();
                renderApp();
                showToast('Демо-данные удалены');
              },
            });
          };
        }

        document.getElementById('btn-clear-all').onclick = function () {
          openConfirm({
            title: 'Очистить все записи?',
            message: 'Будут безвозвратно удалены все съёмки и выходные. Рекомендуем сначала сделать «Экспорт JSON».',
            confirmText: 'Удалить всё',
            danger: true,
            onConfirm: function () {
              state.events = [];
              saveEvents();
              renderApp();
              showToast('Все данные очищены');
            },
          });
        };
      }

      /* ======================================================================
         12. ВКЛАДКА 4: АРХИВ (СТРОГО ТОЛЬКО СТАТУС «ОТДАНО», ГРУППИРОВКА)
         ====================================================================== */
      function renderArchiveTab(container) {
        const allDelivered = state.events.filter(function (e) {
          return e.type === 'shoot' && e.status === 'delivered';
        });

        const payChips = [
          { id: 'all', label: 'Все' },
          { id: 'paid', label: 'Оплачено' },
          { id: 'unpaid', label: 'Есть остаток' },
        ];

        container.innerHTML =
          '<div class="section-head">' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              '<h2 class="section-title">Архив съёмок</h2>' +
              '<span class="pill pill-delivered">' + allDelivered.length + '</span>' +
            '</div>' +
            '<span class="section-sub">Сначала новые</span>' +
          '</div>' +

          (allDelivered.length > 0
            ? '<div class="search-wrap">' +
                '<svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
                '<input id="archive-search-input" type="search" class="search-input" value="' + escapeHtml(state.archiveSearch) + '" placeholder="Поиск по названию, локации, клиенту..." />' +
              '</div>' +
              '<div class="chips-scroll">' +
                payChips.map(function (c) {
                  return '<button type="button" class="filter-chip' + (state.archivePayFilter === c.id ? ' active' : '') + '" data-arch-pay="' + c.id + '">' + c.label + '</button>';
                }).join('') +
              '</div>'
            : '') +

          '<div id="archive-groups-list" class="stack"></div>';

        renderArchiveListOnly();

        const searchEl = document.getElementById('archive-search-input');
        if (searchEl) {
          searchEl.addEventListener('input', function (e) {
            state.archiveSearch = e.target.value;
            renderArchiveListOnly();
          });
        }

        container.querySelectorAll('[data-arch-pay]').forEach(function (chip) {
          chip.addEventListener('click', function () {
            state.archivePayFilter = chip.getAttribute('data-arch-pay');
            container.querySelectorAll('[data-arch-pay]').forEach(function (c) {
              c.classList.toggle('active', c.getAttribute('data-arch-pay') === state.archivePayFilter);
            });
            renderArchiveListOnly();
          });
        });
      }

      function renderArchiveListOnly() {
        const listEl = document.getElementById('archive-groups-list');
        if (!listEl) return;

        const allDelivered = state.events
          .filter(function (e) { return e.type === 'shoot' && e.status === 'delivered'; })
          .sort(function (a, b) {
            const cmp = (b.date || '').localeCompare(a.date || '');
            if (cmp !== 0) return cmp;
            return (b.startTime || '').localeCompare(a.startTime || '');
          });

        if (allDelivered.length === 0) {
          listEl.innerHTML =
            '<div class="empty-state" style="margin-top:6px">' +
              '<div class="empty-icon">' +
                '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                  '<polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5" rx="1"></rect><line x1="10" y1="12" x2="14" y2="12"></line>' +
                '</svg>' +
              '</div>' +
              '<p class="empty-title">Архив пока пуст</p>' +
              '<p class="empty-desc">Сюда попадают все съёмки после перевода в статус «Отдано».</p>' +
            '</div>';
          return;
        }

        const q = state.archiveSearch.trim().toLowerCase();
        const filtered = allDelivered.filter(function (ev) {
          const fin = calcFinance(ev);
          if (state.archivePayFilter === 'paid' && fin.remaining > 0) return false;
          if (state.archivePayFilter === 'unpaid' && fin.remaining <= 0) return false;
          if (q) {
            const hay = ((ev.title || '') + ' ' + (ev.location || '') + ' ' + (ev.contact || '') + ' ' + (ev.notes || '')).toLowerCase();
            if (hay.indexOf(q) === -1) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          listEl.innerHTML =
            '<div class="empty-state" style="padding:22px">' +
              '<p class="empty-desc">По вашему запросу отданных съёмок не найдено.</p>' +
            '</div>';
          return;
        }

        // Группировка по «Месяц Год»
        const groupsOrder = [];
        const groupsMap = Object.create(null);
        for (let i = 0; i < filtered.length; i++) {
          const ev = filtered[i];
          const ym = (ev.date && ev.date.length >= 7) ? ev.date.slice(0, 7) : 'other';
          if (!groupsMap[ym]) {
            groupsMap[ym] = [];
            groupsOrder.push(ym);
          }
          groupsMap[ym].push(ev);
        }

        listEl.innerHTML = groupsOrder.map(function (ym) {
          const items = groupsMap[ym];
          let groupTitle = 'Без даты';
          if (ym !== 'other') {
            const parts = ym.split('-').map(Number);
            groupTitle = MONTHS_NOM[parts[1] - 1] + ' ' + parts[0];
          }

          const cards = items.map(function (ev) {
            const dt = parseLocalDate(ev.date);
            const dayNum = dt ? dt.getDate() : '—';
            const wd = dt ? WEEKDAYS_JS[dt.getDay()] : '';
            const fin = calcFinance(ev);

            const payStatusHtml = fin.remaining > 0
              ? '<span class="pill pill-orange">Остаток: ' + formatRub(fin.remaining) + '</span>'
              : '<span class="pill pill-delivered">Оплачено полностью</span>';

            return (
              '<article class="archive-card" data-open-id="' + ev.id + '">' +
                '<div class="archive-card-top">' +
                  '<div class="date-badge">' +
                    '<span class="date-badge-num">' + dayNum + '</span>' +
                    '<span class="date-badge-wd">' + wd + '</span>' +
                  '</div>' +
                  '<div class="archive-card-body">' +
                    '<div class="archive-card-head">' +
                      '<h4 class="event-title" style="white-space:normal;line-height:1.3">' + escapeHtml(ev.title) + '</h4>' +
                      '<span class="pill pill-delivered" style="flex-shrink:0">Отдано</span>' +
                    '</div>' +
                    (ev.location
                      ? '<div class="event-meta">' +
                          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>' +
                          '<span>' + escapeHtml(ev.location) + '</span>' +
                        '</div>'
                      : '') +
                    (ev.contact
                      ? '<div class="event-meta">' +
                          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>' +
                          '<span>' + escapeHtml(ev.contact) + '</span>' +
                        '</div>'
                      : '') +
                  '</div>' +
                '</div>' +
                '<div class="archive-card-footer">' +
                  '<strong style="font-size:14.5px">' + formatRub(fin.total) + '</strong>' +
                  payStatusHtml +
                '</div>' +
              '</article>'
            );
          }).join('');

          return (
            '<div class="stack">' +
              '<div class="archive-group-head">' +
                '<h3 class="archive-group-title">' + groupTitle + '</h3>' +
                '<span class="section-sub">' + items.length + '</span>' +

            '</div>'
          );
        }).join('');

        bindCardOpeners(listEl);
      }

      /* Универсальная привязка открытия карточек */
      function bindCardOpeners(rootEl) {
        rootEl.querySelectorAll('[data-open-id]').forEach(function (el) {
          el.addEventListener('click', function (e) {
            if (e.target.closest('button')) return;
            const id = el.getAttribute('data-open-id');
            const ev = state.events.find(function (item) { return item.id === id; });
            if (!ev) return;
            if (ev.type === 'dayoff') openDayOffModal(ev);
            else openShootModal(ev);
          });
        });
      }

      /* ======================================================================
         13. ЭКСПОРТ И ИМПОРТ JSON
         ====================================================================== */
      function exportJsonBackup() {
        try {
          const payload = {
            app: 'PhotoCalendarPWA',
            version: 7,
            exportedAt: new Date().toISOString(),
            events: state.events,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'photocalendar-' + getTodayStr() + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Резервная копия JSON сохранена');
        } catch (err) {
          showToast('Не удалось выгрузить JSON', 'error');
        }
      }

      function handleImportFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const parsed = JSON.parse(ev.target.result);
            const list = Array.isArray(parsed) ? parsed : (parsed && parsed.events);
            if (!Array.isArray(list)) {
              showToast('Неверный формат файла JSON', 'error');
              return;
            }
            const valid = list.filter(function (item) {
              return item && typeof item === 'object' && item.date;
            });
            openConfirm({
              title: 'Импортировать резервную копию?',
              message: 'Найдено записей: ' + valid.length + '. Текущий список будет заменён данными из файла.',
              confirmText: 'Импортировать',
              onConfirm: function () {
                state.events = valid.map(function (item) {
                  const isDayOff = item.type === 'dayoff' || item.type === 'personal';
                  return Object.assign({}, item, {
                    id: item.id || generateId(),
                    type: isDayOff ? 'dayoff' : 'shoot',
                    title: item.title || (isDayOff ? 'Выходной' : 'Съёмка'),
                    status: isDayOff ? undefined : (['confirmed', 'editing', 'delivered'].indexOf(item.status) !== -1 ? item.status : 'confirmed'),
                  });
                });
                saveEvents();
                renderApp();
                showToast('Импортировано записей: ' + valid.length);
              },
            });
          } catch (err) {
            showToast('Ошибка чтения JSON-файла', 'error');
          }
        };
        reader.readAsText(file);
      }

        function closeModal() {

        syncStatusBtns();
        root.querySelectorAll('[data-st]').forEach(function (b) {
          b.addEventListener('click', function () {
            statusInput.value = b.getAttribute('data-st');
            syncStatusBtns();
          });
        });

            if (!cur) titleInput.value = label + ': ';
            else if (cur.toLowerCase().indexOf(label.toLowerCase()) === -1) titleInput.value = label + ': ' + cur;

          copyToClipboard(val, 'Контакт скопирован');
        });

        // Авторасчёт остатка и кнопка «Оплачено полностью»
        const totalEl = document.getElementById('s-total');
        const prepayEl = document.getElementById('s-prepay');

        const paidBtn = document.getElementById('s-paid-btn');
        const paidIco = document.getElementById('s-paid-ico');
        const remLabel = document.getElementById('s-rem-label');

        function syncFinanceUI() {
          const total = Math.max(0, Number(totalEl.value) || 0);
          const prepay = Math.max(0, Number(prepayEl.value) || 0);
          const isFull = paidHidden.value === '1';
          const rem = isFull ? 0 : Math.max(0, total - prepay);

          paidBtn.classList.toggle('is-paid', isFull);
          paidIco.innerHTML = isFull
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>'
            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>';

          if (isFull && total > 0) {
            remLabel.textContent = 'Оплачено полностью';
            remLabel.style.color = 'var(--delivered-dark)';
          } else {
            remLabel.textContent = 'Остаток: ' + formatRub(rem);
            remLabel.style.color = 'var(--accent-hover)';
          }
        }

          paidHidden.value = next ? '1' : '0';

          syncFinanceUI();
        });

        totalEl.addEventListener('input', function () {
          if (paidHidden.value === '1') prepayEl.value = totalEl.value;
          syncFinanceUI();
        });

          const t = Number(totalEl.value) || 0;
          const p = Number(prepayEl.value) || 0;

            return;
          }

          const newStatus = statusInput.value;
          const totalPrice = Math.max(0, Number(totalEl.value) || 0);
          const isPaidFull = paidHidden.value === '1';
          const prepayment = isPaidFull ? totalPrice : Math.max(0, Number(prepayEl.value) || 0);

          const saved = {
            id: isEdit ? ev.id : generateId(),
            type: 'shoot',
            title: title,
            status: newStatus,
            date: date,
            startTime: startEl.value || '',
            endTime: endEl.value || '',

            contact: document.getElementById('s-contact').value.trim(),

          if (isEdit) {

            if (idx !== -1) state.events[idx] = saved;
          } else {
            state.events.push(saved);
          }

          if (newStatus === 'confirmed') {
            const dt = parseLocalDate(date);
            if (dt) {

              state.viewMonth = dt.getMonth();
              state.selectedDate = date;

          saveEvents();

          renderApp({ scrollToSelected: state.activeTab === 'calendar' && newStatus === 'confirmed' && state.calListMode === 'month' });

            else if (newStatus === 'delivered') showToast('Добавлено в «Архив»');
            else showToast('Съёмка добавлена в «Календарь»');
          } else {
            showToast('Изменения сохранены');
          }
        });

          };

          if (isEdit) {
            const idx = state.events.findIndex(function (item) { return item.id === ev.id; });
            if (idx !== -1) state.events[idx] = saved;
          } else {
            state.events.push(saved);
          }

          const dt = parseLocalDate(date);
          if (dt) {
            state.viewYear = dt.getFullYear();
            state.viewMonth = dt.getMonth();
            state.selectedDate = date;
          }

          saveEvents();
          closeModal();
          renderApp({ scrollToSelected: state.activeTab === 'calendar' && state.calListMode === 'month' });
          showToast(isEdit ? 'Выходной обновлён' : 'Выходной добавлен');
        });
      }

      /* ======================================================================
         16. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
         ====================================================================== */
      function init() {
        injectPwaManifest();
        loadEvents();

        // Нижняя навигация (4 вкладки)
        document.querySelectorAll('.nav-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            switchTab(btn.getAttribute('data-tab'));
          });
        });

        // Кнопка «+ Съёмка» в шапке
        document.getElementById('header-add-btn').addEventListener('click', function () {
          openShootModal(null, state.selectedDate);
        });

        // Импорт JSON
        document.getElementById('json-import-input').addEventListener('change', function (e) {
          const file = e.target.files && e.target.files[0];
          handleImportFile(file);
        });

        // Закрытие модалок по Escape
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          const cRoot = document.getElementById('confirm-root');
          const mRoot = document.getElementById('modal-root');
          if (!cRoot.classList.contains('hidden')) {
            cRoot.classList.add('hidden');
            cRoot.innerHTML = '';
          } else if (!mRoot.classList.contains('hidden')) {
            mRoot.classList.add('hidden');
            mRoot.innerHTML = '';
          }
        });

        renderApp();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
